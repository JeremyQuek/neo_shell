<!doctype html>
<html>
    <head>
        <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
        <style>
            body {
                background: black;
                color: #0f0;
                font-family: "Courier New", monospace;
                margin: 0;
                overflow: hidden;
            }
            #matrix-canvas {
                position: fixed;
                top: 0;
                left: 0;
                z-index: -1;
                opacity: 0.8;
            }

            #terminal {
                height: 100vh;
                padding: 20px;
                box-sizing: border-box;
            }

            /* Let the rain show through xterm's layers */
            #terminal .xterm,
            #terminal .xterm-viewport,
            #terminal .xterm-screen {
                background-color: transparent !important;
            }

            #terminal .xterm-viewport::-webkit-scrollbar {
                width: 5px;
            }
            #terminal .xterm-viewport::-webkit-scrollbar-thumb {
                background: #050;
            }
        </style>
    </head>
    <body>
        <canvas id="matrix-canvas"></canvas>
        <div id="terminal"></div>

        <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
        <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
        <script>
            // --- Terminal: xterm.js drawn over the rain, wired to a zsh pty ---
            const term = new Terminal({
                allowTransparency: true,
                cursorBlink: true,
                cursorStyle: "block",
                fontFamily: '"Courier New", monospace',
                fontWeight: "bold",
                fontWeightBold: "bold",
                fontSize: 14,
                scrollback: 5000,
                theme: {
                    background: "#00000000",
                    foreground: "#38E057",
                    cursor: "#38E057",
                    cursorAccent: "#000000",
                    selectionBackground: "#38E05755",
                },
            });
            const fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.open(document.getElementById("terminal"));
            fitAddon.fit();
            term.focus();

            // Keystrokes (incl. Ctrl+C, arrows, tab) go straight to the pty
            term.onData((data) => window.electronAPI.sendInput(data));
            window.electronAPI.onOutput((data) => term.write(data));

            // Keep the pty's size in sync with the window
            term.onResize(({ cols, rows }) =>
                window.electronAPI.resize(cols, rows),
            );
            window.addEventListener("resize", () => fitAddon.fit());
            window.addEventListener("click", () => term.focus());

            // Banner first, then start zsh so its prompt lands underneath
            window.electronAPI.onSetUsername((name) => {
                term.write("< NASH UPLINK ESTABLISHED >\r\n");
                term.write(`WAKE UP....${name}\r\n\r\n`);
                window.electronAPI.ready(term.cols, term.rows);
            });

            // --- Matrix Rain Effect ---
            const canvas = document.getElementById("matrix-canvas");
            const ctx = canvas.getContext("2d");

            function initCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener("resize", initCanvas);
            initCanvas();

            const letters = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃ1234567890".split("");
            const fontSize = 16;
            const columns = canvas.width / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);

            function drawRain() {
                ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.font = fontSize + "px arial";

                drops.forEach((y, i) => {
                    const text =
                        letters[Math.floor(Math.random() * letters.length)];
                    ctx.fillStyle = "#38E057";
                    ctx.fillText(text, i * fontSize, y * fontSize);

                    if (y * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                });
            }
            setInterval(drawRain, 33);
        </script>
    </body>
</html>
