<!doctype html>
<html>
    <head>
        <!-- Without this WebKit reads the file as Latin-1 and the katakana turn into ï½± -->
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="vendor/xterm.css" />
        <style>
            body {
                background: black;
                color: #0f0;
                font-family: "Courier New", monospace;
                margin: 0;
                overflow: hidden;
            }
            #matrix-canvas {
                position: fixed;
                top: 0;
                left: 0;
                z-index: -1;
                opacity: 0.8;
                /* Own GPU layer, so redrawing the rain doesn't repaint the text */
                will-change: transform;
            }

            #terminal {
                height: 100vh;
                padding: 20px;
                box-sizing: border-box;
                will-change: transform;
            }

            /* Let the rain show through xterm's layers */
            #terminal .xterm,
            #terminal .xterm-viewport,
            #terminal .xterm-screen {
                background-color: transparent !important;
            }

            #terminal .xterm-viewport::-webkit-scrollbar {
                width: 5px;
            }
            #terminal .xterm-viewport::-webkit-scrollbar-thumb {
                background: #050;
            }
        </style>
    </head>
    <body>
        <canvas id="matrix-canvas"></canvas>
        <div id="terminal"></div>

        <script src="vendor/xterm.js"></script>
        <script src="vendor/addon-fit.js"></script>
        <script>
            // --- Terminal: xterm.js drawn over the rain, wired to a zsh pty ---
            const term = new Terminal({
                allowTransparency: true,
                cursorBlink: true,
                cursorStyle: "block",
                fontFamily: '"Courier New", monospace',
                fontWeight: "bold",
                fontWeightBold: "bold",
                fontSize: 14,
                scrollback: 5000,
                theme: {
                    background: "#00000000",
                    foreground: "#38E057",
                    cursor: "#38E057",
                    cursorAccent: "#000000",
                    selectionBackground: "#38E05755",
                    // Every ANSI colour is a shade of green, so whatever
                    // programs print (git, htop, errors) stays on theme
                    black: "#0A2A12",
                    red: "#7CFF8F",
                    green: "#38E057",
                    yellow: "#9CFF6B",
                    blue: "#1F8F3A",
                    magenta: "#5CE07A",
                    cyan: "#2FBF5A",
                    white: "#B8FFC4",
                    brightBlack: "#1F6B33",
                    brightRed: "#A6FFB0",
                    brightGreen: "#5CFF7A",
                    brightYellow: "#C4FF9C",
                    brightBlue: "#2FBF5A",
                    brightMagenta: "#7CFF8F",
                    brightCyan: "#4CE070",
                    brightWhite: "#E0FFE6",
                },
            });
            const fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.open(document.getElementById("terminal"));
            fitAddon.fit();
            term.focus();

            // Tauri's bridge to the Rust side (main/src/main.rs)
            const { invoke } = window.__TAURI__.core;
            const thisWindow = window.__TAURI__.webviewWindow.getCurrentWebviewWindow();

            // Keystrokes (incl. Ctrl+C, arrows, tab) go straight to the pty
            term.onData((data) => invoke("user_input", { data }));
            // Only this window's shell output (each window runs its own zsh)
            const listening = thisWindow.listen("proc-output", (e) => term.write(e.payload));

            // Keep the pty's size in sync with the window
            term.onResize(({ cols, rows }) => invoke("resize", { cols, rows }));
            window.addEventListener("resize", () => fitAddon.fit());
            window.addEventListener("click", () => term.focus());

            // Banner first, then start zsh so its prompt lands underneath.
            // Wait for the output listener too, or the first prompt is lost.
            invoke("username").then(async (name) => {
                term.write("< NASH UPLINK ESTABLISHED >\r\n");
                term.write(`WAKE UP....${name}\r\n\r\n`);
                await listening;
                invoke("terminal_ready", { cols: term.cols, rows: term.rows });
            });

            // --- Matrix Rain Effect ---
            const canvas = document.getElementById("matrix-canvas");
            const ctx = canvas.getContext("2d");

            // Draw at the screen's real pixel density so Retina stays sharp,
            // while the rain code keeps working in CSS pixels
            function initCanvas() {
                const dpr = window.devicePixelRatio || 1;
                canvas.width = window.innerWidth * dpr;
                canvas.height = window.innerHeight * dpr;
                canvas.style.width = window.innerWidth + "px";
                canvas.style.height = window.innerHeight + "px";
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            window.addEventListener("resize", initCanvas);
            initCanvas();

            const letters = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃ1234567890".split("");
            const fontSize = 16;
            const columns = window.innerWidth / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);

            function drawRain() {
                ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
                ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
                ctx.font = fontSize + "px arial";

                drops.forEach((y, i) => {
                    const text =
                        letters[Math.floor(Math.random() * letters.length)];
                    ctx.fillStyle = "#38E057";
                    ctx.fillText(text, i * fontSize, y * fontSize);

                    if (y * fontSize > window.innerHeight && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                });
            }
            // Same 30 steps/s as before, but painted in sync with the display
            // instead of on a free-running timer that drops frames
            let lastStep = 0;
            function tick(now) {
                if (now - lastStep >= 33) {
                    lastStep = now;
                    drawRain();
                }
                requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        </script>
    </body>
</html>
